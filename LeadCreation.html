  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input { display: block; width: 100%; margin-bottom: .5rem; padding: .5rem; box-sizing: border-box; }
    button { padding: .6rem 1.2rem; }
    #status { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Contact Us form - yes</h1>

  <form id="form1">
    <input name="firstname" type="text" placeholder="First Name" required>
    <input name="lastname" type="text" placeholder="Last Name" required>
    <input name="emailaddress1" type="email" placeholder="Email Address" required>
    <input name="jobtitle" type="text" placeholder="Job Title" required>
    <input name="companyname" type="text" placeholder="Company Name" required>
    <input name="industry" type="text" placeholder="Industry" required>
    <input name="description" type="text" placeholder="Description" required>

    <!-- Prefilled default. Change to type="number" value="0" if the tester
         should be able to see and override it. -->
    <input name="estimatedamount" type="hidden" value="0">

    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>

  <!-- ==========================================================
       2. Form capture bundle
       FIXED: was the .mcas.ms proxy host with McasCtx/McasTsid
       query string, which only resolves inside a Defender for
       Cloud Apps session.
       ========================================================== -->
  <script src="https://formui-usa1.mkt.dynamics.com/usa/FormCapture/FormCapture.bundle.js"></script>
  <script>
    // Reference: https://go.microsoft.com/fwlink/?linkid=2250770

    d365mktformcapture.waitForElement("#form1")
      .then(function (form) {
        var mappings = [
          { FormFieldName: "firstname",      DataverseFieldName: "firstname" },
          { FormFieldName: "lastname",       DataverseFieldName: "lastname" },
          { FormFieldName: "emailaddress1",  DataverseFieldName: "emailaddress1" },
          { FormFieldName: "jobtitle",       DataverseFieldName: "jobtitle" },

          // FIXED: was "Company Name". Logical names are lowercase, no spaces.
          { FormFieldName: "companyname",    DataverseFieldName: "companyname" },

          { FormFieldName: "industry",       DataverseFieldName: "msdyncrm_industry" },
          { FormFieldName: "description",    DataverseFieldName: "description" },
          { FormFieldName: "estimatedamount", DataverseFieldName: "estimatedamount" },

          // Lookups — LogicalName must be the TARGET TABLE, not the column.
          {
            DataverseFieldName: "parentaccountid",
            DataverseFieldValue: "{\"Id\":\"a8df9e83-e07f-f111-ab0e-70a8a5af0770\",\"LogicalName\":\"account\"}",
          },
          {
            DataverseFieldName: "gh_leadsource",
            DataverseFieldValue: "{\"Id\":\"dac0b855-fc89-f111-ab10-00224804f864\",\"LogicalName\":\"gh_leadsource\"}",
          },
          {
            DataverseFieldName: "gh_leadsourcecategory",
            DataverseFieldValue: "{\"Id\":\"7848d936-e181-f111-ab0e-00224804f864\",\"LogicalName\":\"gh_leadcategory\"}",
          },
       
{
DataverseFieldName: "RunContact-Lead-AccountAutomation",
DataverseFieldValue: "1"
},
          
{
DataverseFieldName: "CreateMQL",
DataverseFieldValue: "0"
},
          
        ];

        var captureConfig = {
          FormId: "c986ee08-0c81-f111-ab0e-000d3a33672a",
          FormApiUrl: "https://public-usa.mkt.dynamics.com/api/v1.0/orgs/b577f57d-d194-4c27-b9c9-6cfdbdc904f6/landingpageforms"
        };

        form.addEventListener("submit", function (e) {
          // FIXED: without this the page navigates away and cancels the
          // in-flight POST before Dataverse receives it.
          e.preventDefault();

          var status = document.getElementById("status");
          var serialized = d365mktformcapture.serializeForm(form, mappings);
          console.log("Serialized payload:", JSON.stringify(serialized));

          var payload = serialized.SerializedForm.build();
          status.textContent = "Submitting…";

          d365mktformcapture.submitForm(captureConfig, payload)
            .then(function () {
              status.textContent = "Submitted. Check the form's submission list in Journeys.";
              form.reset();
            })
            .catch(function (err) {
              status.textContent = "Submission failed — see the browser console.";
              console.error("submitForm error:", err);
            });
        }, true);
      });
  </script>

</body>
</html>
